name: Build and deploy

on:
  push:
    branches:
      - deployment
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build backend canister
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build canister wasm
        run: cargo build --release --target wasm32-unknown-unknown -p metasupply_backend

  frontend:
    name: Build and deploy frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # GitHub Pages serves this project from https://<user>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          DFX_NETWORK: ic
          # Set this repository variable to the backend canister ID on the IC mainnet
          # (Settings → Secrets and variables → Actions → Variables).
          CANISTER_ID_METASUPPLY_BACKEND: ${{ vars.CANISTER_ID_METASUPPLY_BACKEND }}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./src/metasupply_frontend/dist
          publish_branch: gh-pages
